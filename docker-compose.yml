services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - shortcut-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment: &backend-env
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: shortcut_ai
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:8081}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      STUB_STORAGE_DIR: /data/storage
      FFPROBE_PATH: ffprobe
      FFMPEG_PATH: ffmpeg
      MEDIA_PROBE_TIMEOUT_SEC: "30"
      MEDIA_DERIVATIVE_TIMEOUT_SEC: "180"
      RENDER_TIMEOUT_SEC: "900"
      MEDIA_INTELLIGENCE_TIMEOUT_SEC: "900"
      SCENE_DETECTION_THRESHOLD: "0.35"
      WORKER_POLL_INTERVAL_SEC: "1.0"
      TRANSCRIPTION_PROVIDER: openai
      TRANSCRIPTION_MODEL: whisper-1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - shortcut-storage:/data/storage
    depends_on:
      mongo:
        condition: service_healthy

  media-worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "workers.media_worker"]
    environment: *backend-env
    volumes:
      - shortcut-storage:/data/storage
    depends_on:
      mongo:
        condition: service_healthy

  render-worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "workers.render_worker"]
    environment: *backend-env
    volumes:
      - shortcut-storage:/data/storage
    depends_on:
      mongo:
        condition: service_healthy

  intelligence-worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "workers.intelligence_worker"]
    environment: *backend-env
    volumes:
      - shortcut-storage:/data/storage
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

  pipeline-worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "workers.pipeline_worker"]
    environment: *backend-env
    volumes:
      - shortcut-storage:/data/storage
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  shortcut-mongo:
  shortcut-storage:
