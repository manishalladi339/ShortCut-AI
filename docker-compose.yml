services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - shortcut-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment: &backend-env
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: shortcut_ai
      JWT_SECRET: local-development-secret-change-me
      APP_PUBLIC_URL: http://localhost:8001
      STORAGE_BACKEND: local
      STUB_STORAGE_DIR: /data/storage
      FFPROBE_PATH: ffprobe
      FFMPEG_PATH: ffmpeg
      MEDIA_PROBE_TIMEOUT_SEC: "30"
      MEDIA_DERIVATIVE_TIMEOUT_SEC: "180"
      RENDER_TIMEOUT_SEC: "900"
      MEDIA_INTELLIGENCE_TIMEOUT_SEC: "900"
      SCENE_DETECTION_THRESHOLD: "0.35"
      WORKER_POLL_INTERVAL_SEC: "1.0"
      TRANSCRIPTION_PROVIDER: openai
      TRANSCRIPTION_MODEL: whisper-1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
    ports:
      - "8001:8001"
    volumes:
      - shortcut-storage:/data/storage
    depends_on:
      mongo:
        condition: service_healthy

  media-worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "workers.media_worker"]
    environment: *backend-env
    volumes:
      - shortcut-storage:/data/storage
    depends_on:
      mongo:
        condition: service_healthy

  render-worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "workers.render_worker"]
    environment: *backend-env
    volumes:
      - shortcut-storage:/data/storage
    depends_on:
      mongo:
        condition: service_healthy

  intelligence-worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "workers.intelligence_worker"]
    environment: *backend-env
    volumes:
      - shortcut-storage:/data/storage
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  shortcut-mongo:
  shortcut-storage:
