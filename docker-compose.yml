services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - shortcut-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: shortcut_ai
      JWT_SECRET: local-development-secret-change-me
      APP_PUBLIC_URL: http://localhost:8001
      STORAGE_BACKEND: local
      STUB_STORAGE_DIR: /data/storage
      FFPROBE_PATH: ffprobe
      WORKER_POLL_INTERVAL_SEC: "1.0"
    ports:
      - "8001:8001"
    volumes:
      - shortcut-storage:/data/storage
    depends_on:
      mongo:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "workers.media_worker"]
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: shortcut_ai
      JWT_SECRET: local-development-secret-change-me
      APP_PUBLIC_URL: http://localhost:8001
      STORAGE_BACKEND: local
      STUB_STORAGE_DIR: /data/storage
      FFPROBE_PATH: ffprobe
      WORKER_POLL_INTERVAL_SEC: "1.0"
    volumes:
      - shortcut-storage:/data/storage
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  shortcut-mongo:
  shortcut-storage:
