services:
  api:
    build:
      context: ./backend
    image: shortcut-ai-backend:${SHORTCUT_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.production
    environment: &backend-env
      ENVIRONMENT: production
      STORAGE_BACKEND: s3
    expose:
      - "8001"
    ports:
      - "127.0.0.1:${SHORTCUT_API_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8001/api/v1/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 5
    stop_grace_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  media-worker:
    image: shortcut-ai-backend:${SHORTCUT_IMAGE_TAG:-latest}
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "workers.media_worker"]
    env_file:
      - .env.production
    environment: *backend-env
    stop_grace_period: 30s
    depends_on:
      api:
        condition: service_healthy

  intelligence-worker:
    image: shortcut-ai-backend:${SHORTCUT_IMAGE_TAG:-latest}
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "workers.intelligence_worker"]
    env_file:
      - .env.production
    environment: *backend-env
    stop_grace_period: 30s
    depends_on:
      api:
        condition: service_healthy

  render-worker:
    image: shortcut-ai-backend:${SHORTCUT_IMAGE_TAG:-latest}
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "workers.render_worker"]
    env_file:
      - .env.production
    environment: *backend-env
    stop_grace_period: 60s
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
