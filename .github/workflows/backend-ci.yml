name: backend-ci
on:
  pull_request:
    paths: ['backend/**', 'docker-compose.yml', '.github/workflows/backend-ci.yml']
  push:
    branches: [main]
    paths: ['backend/**', 'docker-compose.yml', '.github/workflows/backend-ci.yml']
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      EXPO_PUBLIC_BACKEND_URL: http://127.0.0.1:8001
      APP_PUBLIC_URL: http://127.0.0.1:8001
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: shortcut_ci
      JWT_SECRET: ci-only-secret-never-use-in-production
      STUB_STORAGE_DIR: /tmp/shortcut-ci-storage
      PYTHONPATH: backend
      # No mail leaves CI; delivery is separately mocked in provider tests.
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Start API
        run: |
          python -m uvicorn server:app --app-dir backend --host 127.0.0.1 --port 8001 > api.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8001/api/v1/ready; then exit 0; fi
            sleep 1
          done
          cat api.log
          exit 1
      - run: python -m pytest -q backend/tests --tb=short
      - name: Show API logs on failure
        if: failure()
        run: cat api.log
