name: backend-ci

on:
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m compileall -q backend

      - name: Start MongoDB and API
        run: docker compose up -d --build mongo api

      - name: Wait for API
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://localhost:8001/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs api
          exit 1

      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Install integration-test client dependencies
        run: python -m pip install pytest requests pydantic httpx python-dotenv boto3

      - name: Run API integration tests
        env:
          EXPO_PUBLIC_BACKEND_URL: http://localhost:8001
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: shortcut_ai_test_client
          JWT_SECRET: ci-test-secret
        run: pytest -q backend/tests

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color mongo api

      - name: Stop services
        if: always()
        run: docker compose down -v
