name: security-ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4

  python-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt

  frontend-dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
      - name: Enable Yarn
        run: corepack enable
      - name: Install frontend dependencies
        run: yarn install --non-interactive --ignore-scripts
      - name: Audit production dependencies
        shell: bash
        run: |
          set +e
          yarn audit --groups dependencies --json > /tmp/yarn-audit.json
          set -e
          cat /tmp/yarn-audit.json
          node <<'NODE'
          const fs = require("fs");
          const rows = fs.readFileSync("/tmp/yarn-audit.json", "utf8")
            .split(/\r?\n/)
            .filter(Boolean);
          const blocking = [];
          for (const row of rows) {
            let event;
            try { event = JSON.parse(row); } catch { continue; }
            if (event.type !== "auditAdvisory") continue;
            const advisory = event.data && event.data.advisory;
            const severity = String(advisory && advisory.severity || "").toLowerCase();
            if (severity === "high" || severity === "critical") {
              blocking.push({
                module: advisory.module_name,
                severity,
                title: advisory.title,
                url: advisory.url,
              });
            }
          }
          if (blocking.length) {
            console.error("Blocking high/critical production dependency advisories:");
            console.error(JSON.stringify(blocking, null, 2));
            process.exit(1);
          }
          console.log("No high/critical production dependency advisories.");
          NODE

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
